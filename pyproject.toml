[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "y2diag"
version = "1.0.0"
description = "Year-two architecture diagnostics from git history (stdlib only)"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
y2diag = "y2diag.cli:main"

[tool.setuptools.packages.find]
where = ["tool"]
